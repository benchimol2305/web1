<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <img src="images/logo-Mundial.png" class="logo-Mundial" alt="Logo">
        
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Jugadores</a></li>
            <li><a href="#">Plantillas</a></li>
        </ul>

        <img src="images/image.png" class="user-icon" alt="Icono Usuario">

                <div class="user-info">

                </div>

                    </div>
                    <div>
                        <img src="images/help.png" alt="Help">

                        <span>&gt;</span>
                    </div>
                    <div>
                        <img src="images/display.png" alt="Display">
                        <p>Pantalla y accesibilidad</p>
                        <span>&gt;</span>
                    </div>
                    <div>
                        <img src="images/logout.png" alt="Logout">
                        <p>Cerrar sesion</p>
                        <span>&gt;</span>
                    </div>
                </div>

            </div>
        </div>

<script src="script.js"></script>
